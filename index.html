<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>前支任務指揮台 - 內部人員專用</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f8; --panel:#ffffff; --panel2:#eef1f7; --line:#dce1eb;
    --text:#171b26; --muted:#6b7488; --accent:#d9631f; --blue:#2f6fe0;
    --green:#1f9d5c; --amber:#c98a0e; --red:#d64545; --shadow:0 1px 3px rgba(20,25,40,.05);
    --fab-text:#fff; --app-max-width:480px; --page-bg:var(--bg);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1220; --panel:#131b2e; --panel2:#182238; --line:#26314a;
      --text:#e7ecf6; --muted:#7e8aa8; --accent:#ff8c42; --blue:#4f8bff;
      --green:#3ddc84; --amber:#ffcf5c; --red:#ff5a5a; --shadow:none;
      --fab-text:#111;
    }
  }
  @media (min-width:768px){ :root{ --app-max-width:640px; --page-bg:var(--panel2); } }
  @media (min-width:1200px){ :root{ --app-max-width:760px; } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page-bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  input,textarea{-webkit-user-select:text;user-select:text}
  #app{max-width:var(--app-max-width);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow-x:hidden}
  @media (min-width:768px){ #app{box-shadow:0 0 0 1px var(--line);min-height:100vh} }
  input,select,textarea,button{font-family:inherit}
  a{color:inherit}

  /* ---------- 共用元件 ---------- */
  .topbar{padding:16px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .eyebrow{font-family:'JetBrains Mono';font-size:10px;color:var(--accent);letter-spacing:.15em;margin-bottom:4px;font-weight:700}
  .topbar h1{font-family:'Chakra Petch';font-size:18px;margin:0;font-weight:700}
  .topbar p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}
  .topbar .row{display:flex;justify-content:space-between;align-items:flex-start}
  .btn-logout{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);border:1px solid var(--line);background:var(--panel2);padding:6px 10px;border-radius:20px;cursor:pointer}

  .tabs{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{font-family:'JetBrains Mono';font-size:11px;padding:6px 12px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;cursor:pointer;flex-shrink:0}
  .tab.active{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);border-color:var(--accent);font-weight:700}

  .content{flex:1;min-width:0;padding:16px 20px 110px;overflow-y:auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
  .id{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted)}
  .tag{font-family:'JetBrains Mono';font-size:10px;padding:3px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
  .tag.pending{background:color-mix(in srgb, var(--amber) 14%, transparent);color:var(--amber)}
  .tag.assigned{background:color-mix(in srgb, var(--blue) 14%, transparent);color:var(--blue)}
  .tag.filled{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)}
  .tag.rejected{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red)}
  .tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .card h3{font-size:15px;margin:0 0 6px;font-weight:700}
  .card p{font-size:12.5px;color:var(--muted);margin:2px 0}
  .card .time{font-family:'JetBrains Mono';font-size:11.5px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .card .actions{display:flex;gap:8px;margin-top:10px}

  .field{margin-bottom:14px}
  .field label{display:block;font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .field input, .field select, .field textarea{width:100%;max-width:100%;min-width:0;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:13.5px;color:var(--text)}
  .field input[type="datetime-local"]{-webkit-appearance:none;appearance:none}
  .field textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:13.5px;border:none;cursor:pointer}
  .btn-primary{background:var(--accent);color:var(--fab-text)}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-small{padding:8px 12px;font-size:11.5px;border-radius:8px;flex:1}
  .btn-green{background:var(--green);color:#06251a}
  .btn-red{background:var(--red);color:#2a0808}
  .btn-blue{background:var(--blue);color:#fff}

  .section-lbl{font-family:'JetBrains Mono';font-size:10px;color:var(--accent);letter-spacing:.15em;margin:18px 0 10px;font-weight:700}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px}
  .msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:12px}
  .msg.error{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red)}
  .msg.ok{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)}

  .stats{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto}
  .stat{flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-width:78px}
  .stat .n{font-family:'JetBrains Mono';font-size:20px;font-weight:700}
  .stat .l{font-size:10px;color:var(--muted);margin-top:2px}
  .stat.amber .n{color:var(--amber)} .stat.blue .n{color:var(--blue)} .stat.green .n{color:var(--green)}

  .status-cards{display:flex;gap:8px;margin-bottom:16px}
  .status-card{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer}
  .status-card .n{font-family:'JetBrains Mono';font-size:19px;font-weight:700}
  .status-card .l{font-size:10px;color:var(--muted);margin-top:2px}
  .status-card.amber .n{color:var(--amber)} .status-card.blue .n{color:var(--blue)} .status-card.green .n{color:var(--green)} .status-card.gray .n{color:var(--text)}
  .status-card.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .status-card.active .l{color:var(--accent);font-weight:700}

  /* ---------- 行事曆 ---------- */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .cal-title{font-family:'Chakra Petch';font-weight:700;font-size:15px}
  .cal-nav{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono'}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:42px;gap:4px;width:100%}
  .cal-cell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;background:var(--panel);border:1px solid var(--line);min-width:0}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell .daynum{font-size:12.5px}
  .cal-cell.today{border-color:var(--accent);color:var(--accent);font-weight:700}
  .cal-cell.selected{background:color-mix(in srgb, var(--accent) 16%, transparent);border-color:var(--accent)}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max-width);height:74px;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:14px;z-index:10}
  .tabbar .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit}
  .tabbar .item.active{color:var(--accent);font-weight:700}

  .fab{position:fixed;right:20px;bottom:90px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--fab-text);border:none;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:12;cursor:pointer}
  @media (min-width:768px){ .fab{right:calc(50% - (var(--app-max-width) / 2) + 20px)} }
  .viewmode-cards{display:flex;gap:10px;margin-bottom:16px}
  .viewmode-card{width:76px;height:76px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
  .viewmode-card.active{background:color-mix(in srgb, var(--accent) 14%, transparent);border-color:var(--accent);color:var(--accent)}
  .back-link{display:inline-block;font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:20px;cursor:pointer;margin-bottom:14px}

  /* ---------- 標籤 ---------- */
  .tag-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--tag-color, var(--muted));margin-bottom:6px}
  .tag-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tag-color, var(--muted));flex-shrink:0}
  .tag-picker{display:flex;gap:8px;flex-wrap:wrap}
  .tag-pick-chip{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--tag-color);color:var(--tag-color);cursor:pointer;background:color-mix(in srgb, var(--tag-color) 10%, transparent)}
  .tag-pick-chip.selected{background:var(--tag-color);color:#fff}
  .color-swatches{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .color-swatch.selected{border-color:var(--text)}

  /* ---------- 底部彈出選單／彈窗 ---------- */
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:var(--app-max-width);max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:6px 0 max(10px, env(safe-area-inset-bottom))}
  .sheet-title{padding:14px 20px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet-item{display:block;width:100%;text-align:center;padding:16px;font-size:15px;color:var(--text);background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit}
  .sheet-item.danger{color:var(--red)}
  .sheet-item.cancel{border-bottom:none;color:var(--muted);font-weight:700;margin-top:6px}
  .copy-modal .cal-grid{grid-auto-rows:38px}

  /* ---------- 登入畫面 ---------- */
  .auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px}
  .auth-wrap .brand-mark{width:44px;height:44px;border:2px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);margin-bottom:20px}
  .auth-wrap .brand-mark span{transform:rotate(-45deg);font-family:'Chakra Petch';font-weight:700;color:var(--accent)}
  .auth-wrap h1{font-family:'Chakra Petch';font-size:22px;margin:0 0 4px;font-weight:700}
  .auth-wrap p.sub{margin:0 0 26px;font-size:12.5px;color:var(--muted)}
  .auth-switch{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
  .auth-switch b{color:var(--accent);cursor:pointer}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-family:'JetBrains Mono';font-size:12px}

  /* ---------- 下拉重新整理 ---------- */
  .pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);width:100%;max-width:var(--app-max-width);display:flex;justify-content:center;align-items:center;padding:14px 0;z-index:50;pointer-events:none;transition:none}
  .pull-indicator .spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%}
  .pull-indicator .spinner.spin{animation:pullspin .7s linear infinite}
  @keyframes pullspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading">載入中…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult,
  GoogleAuthProvider, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, collection,
  query, where, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------------------------------
// Firebase 設定：共用衛生營系統（medical-battalion-tracker）專案
// ------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDHJ_ZVLwl9-bD-ZPCTsBcfSjK1A15oJN4",
  authDomain: "medical-battalion-tracker.firebaseapp.com",
  projectId: "medical-battalion-tracker",
  storageBucket: "medical-battalion-tracker.firebasestorage.app",
  messagingSenderId: "442272611220",
  appId: "1:442272611220:web:88ef96f7789200c27ded81",
};

const BUILD_VERSION = "2026-07-31.27";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

// 處理 Google signInWithRedirect 回跳後的結果；失敗時記錄下來，登入頁渲染時顯示給使用者看
getRedirectResult(auth).catch((e) => {
  console.error("Google 登入失敗", e);
  gateErrorText = `Google 登入失敗（${e.code || e.message}）`;
  if (document.getElementById("authMsg")) {
    document.getElementById("authMsg").innerHTML = `<div class="msg error">${gateErrorText}</div>`;
  }
});

// 本系統獨立 collection（避免與衛生營原系統資料衝突）
const COL_REQUESTS = "forward_support_requests";
const COL_ASSIGNMENTS = "forward_support_assignments";
const COL_UNITS = "forward_support_units";
const COL_TAGS = "forward_support_tags";

const TAG_COLOR_PALETTE = ["#d9631f","#2f6fe0","#1f9d5c","#c98a0e","#d64545","#8b5cf6","#0891b2","#db2777"];

// 底部導覽列圖示（線條風格，stroke 用 currentColor 跟著 active 狀態變色）
const ICON_HOME = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`;
const ICON_TASKS = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="m8.5 12.5 2 2 4-4.5"/></svg>`;
const ICON_RECORDS = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`;
const ICON_MORE = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg>`;
const ICON_LIST = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>`;
const ICON_CALENDAR = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>`;

const UNITS_INTERNAL = ["營部", "一連", "二連"];
const STATUS_LABEL = { pending:"待審核", assigned:"已分發", filled:"已完成", rejected:"不核准" };
const VALID_INTERNAL_ROLES = ["dispatcher", "battalion_hq", "company1", "company2", "admin"];

let currentUser = null;   // Firebase Auth user
let profile = null;       // Firestore users/{uid} 文件內容
let allRequests = [];     // 目前使用者可見的任務快取
let unsubRequests = null;
let activeTab = null;
let gateErrorText = null; // 登入被擋下時要顯示的錯誤訊息（避免 signOut 觸發的重繪把訊息蓋掉）
let availableTags = [];   // 前支種類標籤快取
let unsubTags = null;
let pickedTagId = null;   // 新增／編輯任務表單目前選取的標籤

const $app = document.getElementById("app");

window.addEventListener("error", (ev) => {
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#d64545;color:#fff;padding:10px 14px;font-size:12px;z-index:9999;font-family:monospace";
  banner.textContent = "程式錯誤：" + (ev.message || ev.error);
  document.body.prepend(banner);
});
window.addEventListener("unhandledrejection", (ev) => {
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#d64545;color:#fff;padding:10px 14px;font-size:12px;z-index:9999;font-family:monospace";
  banner.textContent = "未處理的錯誤：" + (ev.reason && (ev.reason.message || ev.reason.code) || ev.reason);
  document.body.prepend(banner);
});

// ------------------------------------------------------------
// Auth 狀態監聽
// ------------------------------------------------------------
onAuthStateChanged(auth, async (user) => {
  if (unsubRequests) { unsubRequests(); unsubRequests = null; }
  currentUser = user;
  if (!user) { profile = null; renderLogin(); return; }

  let snap;
  try {
    snap = await getDoc(doc(db, "users", user.uid));
  } catch (e) {
    gateErrorText = `讀取帳號資料失敗：${e.code || e.message}（可能是 Firestore 規則還沒設定好）`;
    await signOut(auth);
    return; // signOut 會觸發 onAuthStateChanged(null)，由那次呼叫負責畫面重繪
  }

  if (!snap.exists()) {
    gateErrorText = "找不到此帳號的角色設定，請聯絡管理者加上 fsr_role 欄位";
    await signOut(auth);
    return;
  }
  profile = snap.data();
  if (!profile.fsr_role) {
    gateErrorText = "這個 Google 帳號還沒被設定 fsr_role，請到 Firestore 的 users 文件加上角色欄位（dispatcher／battalion_hq／company1／company2／admin）";
    await signOut(auth);
    return;
  }
  if (profile.fsr_role === "applicant") {
    gateErrorText = "此帳號為申請單位帳號，請至申請人站登入";
    await signOut(auth);
    return;
  }
  if (!VALID_INTERNAL_ROLES.includes(profile.fsr_role)) {
    gateErrorText = `fsr_role 欄位值「${escapeHtml(profile.fsr_role)}」不是合法角色，請確認拼字是否正確（dispatcher／battalion_hq／company1／company2／admin）`;
    await signOut(auth);
    return;
  }
  gateErrorText = null;
  bootRoleApp();
});

// ==============================================================
// 登入（本站僅供內部人員，無註冊功能）
// ==============================================================
function renderLogin() {
  $app.innerHTML = `
    <div class="auth-wrap">
      <div class="brand-mark"><span>前</span></div>

async function doLogin() {
  const msg = document.getElementById("authMsg");
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">開啟 Google 登入中…</div>`;
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (e) {
    console.error("signInWithPopup 失敗", e);
    // 部分瀏覽器（尤其部分 Android WebView）會擋 popup，退回用 redirect 方式
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (e2) {
        msg.innerHTML = `<div class="msg error">登入失敗：${authErrorText(e2)}</div>`;
        return;
      }
    }
    msg.innerHTML = `<div class="msg error">登入失敗：${authErrorText(e)}</div>`;
  }
}

function authErrorText(e) {
  const code = e && e.code || "";
  if (code.includes("popup-closed-by-user") || code.includes("cancelled-popup-request")) return "登入已取消";
  return e.message || "發生未知錯誤";
}

function renderHomeView() {
  const c = document.getElementById("content");
  const pending = allRequests.filter(r => r.status === "pending");
  const weekTasks = allRequests.filter(r => r.taskStartTime && isThisWeek(tsToDate(r.taskStartTime)));
  const statsHtml = `
    <div class="stats">
      <div class="stat amber"><div class="n">${pending.length}</div><div class="l">待審核</div></div>
      <div class="stat blue"><div class="n">${weekTasks.length}</div><div class="l">本週任務</div></div>
    </div>`;
  const pendingHtml = pending.length === 0
    ? `<div class="empty">目前沒有待審核任務</div>`
    : pending.map(r => taskCardHtml(r, true)).join("");
  const weekHtml = weekTasks.length === 0
    ? `<div class="empty">本週目前沒有排定的任務</div>`
    : weekTasks.map(r => taskCardHtml(r, false)).join("");
  c.innerHTML = statsHtml +
    `<div class="section-lbl">待審核</div>${pendingHtml}` +
    `<div class="section-lbl" style="margin-top:22px">本週任務</div>${weekHtml}`;
  bindCardMenu(c);
  pending.forEach(r => {
    const assignBtn = document.getElementById(`assign-${r.id}`);
    if (assignBtn) assignBtn.onclick = () => openAssignPrompt(r);
    const rejectBtn = document.getElementById(`reject-${r.id}`);
    if (rejectBtn) rejectBtn.onclick = () => rejectRequest(r);
  });
}

function tsToDate(ts) { return ts.toDate ? ts.toDate() : new Date(ts); }
function isThisWeek(d) {
  const now = new Date();
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
  return d >= startOfWeek && d < endOfWeek;
}
function isThisMonth(d) {
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

// ---- 子頁：行事曆（依任務開始時間看每天有哪些前支任務）----
let calendarMonth = new Date();
let selectedCalendarDate = null;

function fmtDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

function renderCalendarView() {
  const c = document.getElementById("taskViewArea");
  const y = calendarMonth.getFullYear(), m = calendarMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  const byDate = {};
  allRequests.forEach(r => {
    if (!r.taskStartTime) return;
    const d = r.taskStartTime.toDate ? r.taskStartTime.toDate() : new Date(r.taskStartTime);
    const key = fmtDateKey(d);
    (byDate[key] = byDate[key] || []).push(r);
  });

  const todayKey = fmtDateKey(new Date());
  let cellsHtml = "";
  for (let i = 0; i < startWeekday; i++) cellsHtml += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const count = (byDate[key] || []).length;
    cellsHtml += `<div class="cal-cell ${key===todayKey?"today":""} ${key===selectedCalendarDate?"selected":""}" data-date="${key}">
      <span class="daynum">${day}</span>
      ${count > 0 ? `<span class="dot"></span>` : ""}
    </div>`;
  }

  c.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title">${y} 年 ${m+1} 月</div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-weekdays">${["日","一","二","三","四","五","六"].map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-grid">${cellsHtml}</div>
    <div id="calDayList" style="margin-top:18px"></div>`;

  document.getElementById("calPrev").onclick = () => { calendarMonth = new Date(y, m-1, 1); renderCalendarView(); };
  document.getElementById("calNext").onclick = () => { calendarMonth = new Date(y, m+1, 1); renderCalendarView(); };
  document.querySelectorAll(".cal-cell[data-date]").forEach(el => {
    el.onclick = () => { selectedCalendarDate = el.dataset.date; renderCalendarView(); };
  });

  const listEl = document.getElementById("calDayList");
  if (!selectedCalendarDate) {
    listEl.innerHTML = `<div class="empty">點選上方日期查看當天的前支任務</div>`;
    return;
  }
  const list = byDate[selectedCalendarDate] || [];
  if (list.length === 0) {
    listEl.innerHTML = `<div class="section-lbl">${selectedCalendarDate}</div><div class="empty">這天沒有任務</div>`;
    return;
  }
  listEl.innerHTML = `<div class="section-lbl">${selectedCalendarDate} ・ 共 ${list.length} 筆</div>` +
    list.map(r => taskCardHtml(r, r.status === "pending")).join("");
  bindCardMenu(listEl);
  list.forEach(r => {
    const assignBtn = document.getElementById(`assign-${r.id}`);
    if (assignBtn) assignBtn.onclick = () => openAssignPrompt(r);
    const rejectBtn = document.getElementById(`reject-${r.id}`);
    if (rejectBtn) rejectBtn.onclick = () => rejectRequest(r);
  });
}

function bindTagPicker(pickerId) {
  document.querySelectorAll(`#${pickerId} .tag-pick-chip`).forEach(el => {

  unsubAccounts = onSnapshot(q, (snap) => {
    applicantAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeSection === "more") drawAccountsList();
  }, (e) => {
    c.innerHTML = `<div class="msg error">讀取失敗：${e.message}（可能是 Firestore 規則還沒開放管理者讀取 users）</div>`;
  });

  if (unsubInternalAccounts) unsubInternalAccounts();
  const q2 = query(collection(db, "users"), where("fsr_role", "in", ["dispatcher","battalion_hq","company1","company2","admin"]));
  unsubInternalAccounts = onSnapshot(q2, (snap) => {
    internalAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeSection === "more") drawAccountsList();
  });
}

async function doAddTag(getColor) {
  const nameInput = document.getElementById("newTagName");
  const name = nameInput.value.trim();
  const msg = document.getElementById("tagMsg");
  if (!name) { msg.innerHTML = `<div class="msg error">請輸入標籤名稱</div>`; return; }
  try {
    await addDoc(collection(db, COL_TAGS), { name, color: getColor(), createdAt: serverTimestamp() });
    msg.innerHTML = `<div class="msg ok">已新增標籤</div>`;
    nameInput.value = "";
  } catch (e) { msg.innerHTML = `<div class="msg error">新增失敗：${e.message}</div>`; }
}

async function saveTagNow(id, name, getColor) {
  if (!name) { alert("標籤名稱不能空白"); return; }
  try {
    await updateDoc(doc(db, COL_TAGS, id), { name, color: getColor() });

}

async function deleteTagNow(id) {

async function doSetInternalRole() {
  const msg = document.getElementById("setRoleMsg");
  const email = document.getElementById("setRoleEmail").value.trim();

  if (!email) { msg.innerHTML = `<div class="msg error">請輸入 Email</div>`; return; }

  try {
    const q = query(collection(db, "users"), where("email", "==", email));
    const snap = await getDocs(q);
    if (snap.empty) {
      msg.innerHTML = `<div class="msg error">找不到這個 email 的帳號，請確認對方已經登入過衛生營系統至少一次</div>`;
      return;
    }
    const targetDoc = snap.docs[0];
    const targetData = targetDoc.data();
    await updateDoc(doc(db, "users", targetDoc.id), { fsr_role: role });
    const displayName = (targetData.rank ? targetData.rank + " " : "") + (targetData.displayName || email);

function openTaskActionSheet(taskId) {
  const r = allRequests.find(x => x.id === taskId);
  if (!r) return;

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";

  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-title">${escapeHtml(r.location || "")}</div>
      <button class="sheet-item" id="sheetEdit">編輯</button>
      <button class="sheet-item" id="sheetCopy">複製到其他日期</button>

      <button class="sheet-item cancel" id="sheetCancel">取消</button>

  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSheet(); });

  document.getElementById("sheetCopy").onclick = () => { closeSheet(); openCopyToDatesModal(r); };

// ---- 複製到其他日期（多選行事曆，跟原本的複製到多天） ----
let copySourceTask = null;
let copySelectedDates = new Set();
let copyCalMonth = new Date();

function openCopyToDatesModal(task) {
  copySourceTask = task;
  copySelectedDates = new Set();
  copyCalMonth = new Date();
  renderCopyModal();
}

function closeCopyModal() {
  const overlay = document.getElementById("copyModalOverlay");
  if (overlay) overlay.remove();
  copySourceTask = null;
}

function renderCopyModal() {
  let overlay = document.getElementById("copyModalOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.className = "sheet-overlay";
    overlay.id = "copyModalOverlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCopyModal(); });
  }
  const y = copyCalMonth.getFullYear(), m = copyCalMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayKey = fmtDateKey(new Date());
  let cellsHtml = "";
  for (let i = 0; i < startWeekday; i++) cellsHtml += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const sel = copySelectedDates.has(key);
    cellsHtml += `<div class="cal-cell ${key===todayKey?"today":""} ${sel?"selected":""}" data-date="${key}"><span class="daynum">${day}</span></div>`;
  }
  overlay.innerHTML = `
    <div class="sheet copy-modal">
      <div class="sheet-title">複製「${escapeHtml(copySourceTask.location || "")}」到其他日期</div>
      <div style="padding:14px 20px 0">
        <div class="cal-header">
          <button class="cal-nav" id="copyCalPrev">‹</button>
          <div class="cal-title">${y} 年 ${m+1} 月</div>
          <button class="cal-nav" id="copyCalNext">›</button>
        </div>
        <div class="cal-weekdays">${["日","一","二","三","四","五","六"].map(w=>`<div>${w}</div>`).join("")}</div>
        <div class="cal-grid">${cellsHtml}</div>
        <p style="font-size:11px;color:var(--muted);margin:10px 0 0">點選日期可複選，會保留原任務的時間長度</p>
      </div>
      <div style="padding:16px 20px">
        <button class="btn btn-primary" id="copyConfirmBtn">複製到已選日期（${copySelectedDates.size}）</button>
        <button class="back-link" id="copyCancelBtn" style="display:block;text-align:center;margin:10px auto 0">取消</button>
      </div>
    </div>`;
  document.getElementById("copyCalPrev").onclick = () => { copyCalMonth = new Date(y, m-1, 1); renderCopyModal(); };
  document.getElementById("copyCalNext").onclick = () => { copyCalMonth = new Date(y, m+1, 1); renderCopyModal(); };
  document.querySelectorAll("#copyModalOverlay .cal-cell[data-date]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.date;
      if (copySelectedDates.has(k)) copySelectedDates.delete(k); else copySelectedDates.add(k);
      renderCopyModal();
    };
  });
  document.getElementById("copyConfirmBtn").onclick = doCopyToDates;
  document.getElementById("copyCancelBtn").onclick = closeCopyModal;
}

async function doCopyToDates() {
  if (copySelectedDates.size === 0) { alert("請至少選一個日期"); return; }
  const src = copySourceTask;
  const btn = document.getElementById("copyConfirmBtn");
  btn.disabled = true; btn.textContent = "複製中…";
  const startBase = tsToDate(src.taskStartTime);
  const endBase = tsToDate(src.taskEndTime);
  const durationMs = endBase - startBase;
  try {
    for (const key of copySelectedDates) {
      const [yy, mm, dd] = key.split("-").map(Number);
      const newStart = new Date(yy, mm - 1, dd, startBase.getHours(), startBase.getMinutes());
      const newEnd = new Date(newStart.getTime() + durationMs);
      await addDoc(collection(db, COL_REQUESTS), {
        applicantUnit: src.applicantUnit || "", applicantRank: src.applicantRank || "", applicantName: src.applicantName || "",
        location: src.location || "",
        taskStartTime: newStart, taskEndTime: newEnd,
        remarks: src.remarks || "",
        tagId: src.tagId || null, tagName: src.tagName || null, tagColor: src.tagColor || null,
        status: src.status, assignedUnit: src.assignedUnit || null,
        createdAt: serverTimestamp(),
        createdBy: currentUser.uid,
        createdByDispatcher: true,
        reviewedBy: src.reviewedBy || null,
        reviewedAt: src.reviewedAt || null,
      });
    }
    closeCopyModal();
  } catch (e) {
    alert("複製失敗：" + e.message);
    btn.disabled = false; btn.textContent = `複製到已選日期（${copySelectedDates.size}）`;
  }
}

function taskCardHtml(r, withDispatchActions=false, withFillAction=false) {
  const start = fmtTs(r.taskStartTime), end = fmtTs(r.taskEndTime);
  const tagClass = r.status === "pending" ? "pending" : r.status === "assigned" ? "assigned" : r.status === "filled" ? "filled" : "rejected";
  let actions = "";
  if (withDispatchActions && r.status === "pending") {
    actions = `<div class="actions">
      <button class="btn btn-small btn-green" id="assign-${r.id}">分發</button>
      <button class="btn btn-small btn-red" id="reject-${r.id}">駁回</button>
    </div>`;
  }
  if (withFillAction && r.status === "assigned") {
    actions = `<div class="actions"><button class="btn btn-small btn-blue" id="fill-${r.id}">填寫車長／駕駛</button></div>`;
  }
  return `
    <div class="card" data-taskid="${r.id}">
      <div class="task-top">
        <span class="id">#${(r.id||"").slice(-6).toUpperCase()}</span>
        <span class="tag ${tagClass}">${STATUS_LABEL[r.status] || r.status}${r.assignedUnit ? "・" + r.assignedUnit : ""}</span>
      </div>
      ${r.tagName ? `<div class="tag-chip" style="--tag-color:${escapeHtml(r.tagColor || "")}">${escapeHtml(r.tagName)}</div>` : ""}
      <h3>${escapeHtml(r.location || "")}</h3>
      <p>申請單位｜${escapeHtml(r.applicantUnit || "")}</p>
      <p>申請人｜${escapeHtml(r.applicantRank || "")} ${escapeHtml(r.applicantName || "")}</p>
      ${r.remarks ? `<p>備註｜${escapeHtml(r.remarks)}</p>` : ""}
      <div class="time">${start} — ${end}</div>
      ${actions}
    </div>`;
}

function fmtTs(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function displayNameOf(p) {
  if (!p) return "";
  const namePart = (p.rank ? p.rank + " " : "") + (p.displayName || "");
  return namePart.trim() || p.email || "";
}

// ==============================================================
// 下拉重新整理（在頁面最頂端往下拉，放開後重新整理頁面）
// ==============================================================
(function initPullToRefresh() {
  const THRESHOLD = 68;
  let startY = 0, pulling = false, scrollEl = null, indicator = null;

  function findScrollEl(target) {
    let el = target;
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains("content")) return el;
      el = el.parentElement;
    }
    return null;
  }
  function ensureIndicator() {
    if (indicator) return indicator;
    indicator = document.createElement("div");
    indicator.className = "pull-indicator";
    indicator.innerHTML = `<div class="spinner"></div>`;
    document.body.appendChild(indicator);
    return indicator;
  }

  document.addEventListener("touchstart", (e) => {
    scrollEl = findScrollEl(e.target);
    if (!scrollEl || scrollEl.scrollTop > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!pulling || !scrollEl || scrollEl.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    const dist = Math.min(dy, 110);
    const ind = ensureIndicator();
    ind.style.transform = `translateX(-50%) translateY(${dist - 60}px)`;
    ind.querySelector(".spinner").classList.toggle("spin", dist > THRESHOLD);
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!pulling) return;
    pulling = false;
    if (!indicator) return;
    const style = indicator.style.transform;
    const match = style.match(/translateY\(([-\d.]+)px\)/);
    const dist = match ? parseFloat(match[1]) + 60 : 0;
    if (dist > THRESHOLD) {
      indicator.querySelector(".spinner").classList.add("spin");
      indicator.style.transform = `translateX(-50%) translateY(20px)`;
      setTimeout(() => location.reload(), 250);
    } else {
      indicator.style.transform = `translateX(-50%) translateY(-100%)`;
    }
  });
})();
</script>
