<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>前支任務派遣中心 - 內部人員專用</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1e9; --panel:#ffffff; --panel2:#ece8dc; --line:#e5e1d2;
    --text:#2c2a24; --muted:#8d8a7c; --accent:#3f7d73; --blue:#3d6ba8; --blue-ink:#fff;
    --green:#5fa88e; --amber:#b3823a; --red:#d2836f; --purple:#7b6ea3; --cyan:#4c8fa0; --shadow:0 10px 24px -12px rgba(60,50,20,.18);
    --shadow-fab:0 10px 22px -4px rgba(63,125,115,.4);
    --fab-text:#f3fbf8; --app-max-width:480px; --page-bg:var(--bg);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1b17; --panel:#252420; --panel2:#2c2a24; --line:#3b382f;
      --text:#ede9dd; --muted:#a39e8c; --accent:#6fb3a4; --blue:#8fb0cc; --blue-ink:#0d2233;
      --green:#7ec2a4; --amber:#d9b36b; --red:#e0987f; --purple:#a79bc9; --cyan:#6faab8; --shadow:none;
      --shadow-fab:0 10px 22px -4px rgba(0,0,0,.45);
      --fab-text:#14201c;
    }
  }
  @media (min-width:768px){ :root{ --app-max-width:640px; --page-bg:var(--panel2); } }
  @media (min-width:1200px){ :root{ --app-max-width:760px; } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--page-bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  input,textarea{-webkit-user-select:text;user-select:text}
  #app{max-width:var(--app-max-width);margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
  @media (min-width:768px){ #app{box-shadow:0 0 0 1px var(--line)} }
  input,select,textarea,button{font-family:inherit}
  a{color:inherit}

  /* ---------- 共用元件 ---------- */
  .topbar{padding:16px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .eyebrow{font-family:'JetBrains Mono';font-size:10px;color:var(--accent);letter-spacing:.15em;margin-bottom:4px;font-weight:700}
  .topbar h1{font-family:'Chakra Petch';font-size:18px;margin:0;font-weight:700}
  .topbar p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}
  .topbar .row{display:flex;justify-content:space-between;align-items:flex-start}

  /* 橫向滑動的列表（分頁列／狀態卡／常用名稱）都隱藏原生捲軸，滑動手感
     還在，只是不顯示那條黑色/灰色的捲軸列 */
  .tabs, .status-cards, .preset-chip-row{scrollbar-width:none;-ms-overflow-style:none}
  .tabs::-webkit-scrollbar, .status-cards::-webkit-scrollbar, .preset-chip-row::-webkit-scrollbar{display:none}

  .tabs{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{font-family:'JetBrains Mono';font-size:11px;padding:6px 12px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;cursor:pointer;flex-shrink:0}
  .tab.active{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);border-color:var(--accent);font-weight:700}

  .date-range-field{display:flex;gap:8px}
  .date-range-field .field{flex:1;min-width:0;margin-bottom:0}
  .date-range-sep{flex-shrink:0;color:var(--muted);display:flex;align-items:center;justify-content:center;height:44px;margin-top:24px}

  .content{flex:1;min-width:0;padding:16px 20px calc(140px + env(safe-area-inset-bottom));overflow-y:auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
  .id{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted)}
  .tag{font-family:'JetBrains Mono';font-size:10px;padding:3px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
  .tag.pending{background:color-mix(in srgb, var(--amber) 14%, transparent);color:var(--amber)}
  .tag.reviewing{background:color-mix(in srgb, var(--purple) 14%, transparent);color:var(--purple)}
  .tag.approved{background:color-mix(in srgb, var(--cyan) 14%, transparent);color:var(--cyan)}
  .tag.assigned{background:color-mix(in srgb, var(--blue) 14%, transparent);color:var(--blue)}
  .tag.filled{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)}
  .tag.rejected{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red)}
  .tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .card h3{font-size:15px;margin:0 0 6px;font-weight:700}
  .card p{font-size:12.5px;color:var(--muted);margin:2px 0}
  .card .time{font-family:'JetBrains Mono';font-size:11.5px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .card .actions{display:flex;gap:8px;margin-top:10px}
  .muted-note{font-size:12px;color:var(--muted)}

  .field{margin-bottom:14px}
  .field label{display:block;font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
  .field input, .field select, .field textarea{width:100%;max-width:100%;min-width:0;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:13.5px;color:var(--text)}
  .field input[type="date"]{-webkit-appearance:none;appearance:none;display:block}
  .field textarea{resize:vertical;min-height:64px}
  .person-info{margin-top:8px;padding:10px 12px;background:var(--panel2);border-radius:10px;border-left:3px solid var(--accent)}
  .person-info .row{display:flex;gap:10px;align-items:baseline}
  .person-info .row + .row{margin-top:6px}
  .person-info .lbl{flex:0 0 auto;width:32px;color:var(--accent);font-weight:700;font-size:12.5px}
  .person-info .val{flex:1;min-width:0;color:var(--text);font-weight:600;font-size:13px}
  .person-info .val .sub{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:18px;font-weight:700;font-size:13.5px;border:none;cursor:pointer;position:relative;overflow:hidden}
  .btn-primary{background:var(--accent);color:var(--fab-text)}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-small{padding:8px 12px;font-size:11.5px;border-radius:14px;flex:1}
  .btn-green{background:var(--green);color:#06251a}
  .btn-red{background:var(--red);color:#2a0808}
  .btn-blue{background:var(--blue);color:var(--blue-ink)}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{width:auto;flex:1}

  .section-lbl{font-family:'JetBrains Mono';font-size:10px;color:var(--accent);letter-spacing:.15em;margin:18px 0 10px;font-weight:700}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px}
  .msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:12px}
  .msg.error{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red)}
  .msg.ok{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)}

  .stats{display:flex;gap:10px;margin-bottom:16px}
  .stat{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:'JetBrains Mono';font-size:20px;font-weight:700}
  .stat .l{font-size:10px;color:var(--muted);margin-top:2px}
  .stat.amber .n{color:var(--amber)} .stat.blue .n{color:var(--blue)} .stat.green .n{color:var(--green)}

  /* 首頁：各單位本週任務量小卡 */
  .unit-load-row{display:flex;gap:10px;margin-bottom:16px}
  .unit-load-chip{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
  .unit-load-chip .n{display:block;font-family:'JetBrains Mono';font-size:17px;font-weight:700;color:var(--accent)}
  .unit-load-chip .l{font-size:10px;color:var(--muted);margin-top:2px}

  .status-cards{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
  .status-card{flex:0 0 auto;width:84px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 4px;text-align:center;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both}
  .status-card .n{font-family:'JetBrains Mono';font-size:19px;font-weight:700}
  .status-card .l{font-size:10px;color:var(--muted);margin-top:2px}
  .status-card.amber .n{color:var(--amber)} .status-card.purple .n{color:var(--purple)} .status-card.cyan .n{color:var(--cyan)} .status-card.blue .n{color:var(--blue)} .status-card.green .n{color:var(--green)} .status-card.gray .n{color:var(--text)}

  .more-menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .more-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeSlideUp .4s cubic-bezier(.22,1,.36,1) both}
  .more-card h3{margin:0;font-size:13.5px;color:var(--text)}
  .status-card.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .status-card.active .l{color:var(--accent);font-weight:700}

  /* ---------- 行事曆 ---------- */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .cal-title{font-family:'Chakra Petch';font-weight:700;font-size:15px}
  .cal-nav{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:10.5px;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono'}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:42px;gap:4px;width:100%}
  .cal-cell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;background:var(--panel);border:1px solid var(--line);min-width:0}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell .daynum{font-size:12.5px}
  .cal-cell.today{border-color:var(--accent);color:var(--accent);font-weight:700}
  .cal-cell.selected{background:color-mix(in srgb, var(--accent) 16%, transparent);border-color:var(--accent)}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max-width);height:calc(74px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:calc(14px + env(safe-area-inset-bottom));z-index:10}
  .tabbar .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;position:relative;z-index:1;transition:color .25s ease}
  .tabbar .item.active{color:var(--accent);font-weight:700}
  /* 水滴狀的分頁指示器：跟著切換的分頁滑過去，用微微過衝（overshoot）的
     曲線模擬液體的彈性感，不是機械式的線性平移 */
  .tab-indicator{position:absolute;top:8px;left:0;height:38px;width:25%;border-radius:16px;background:color-mix(in srgb, var(--accent) 14%, transparent);transition:transform .5s cubic-bezier(.34,1.45,.4,1),width .3s ease,top .3s ease,height .3s ease;opacity:0;pointer-events:none;z-index:0}

  /* ---------- 水滴漣漪點擊效果 ---------- */
  .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 40%, transparent) 0%, color-mix(in srgb, var(--accent) 12%, transparent) 60%, transparent 100%);transform:scale(0);opacity:.6;animation:rippleAnim .6s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none}
  @keyframes rippleAnim{ to{ transform:scale(1); opacity:0 } }

  /* ---------- 卡片/區塊柔和進場動畫 ---------- */
  @keyframes fadeSlideUp{ from{ opacity:0; transform:translateY(10px) scale(.98) } to{ opacity:1; transform:translateY(0) scale(1) } }

  .fab{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--fab-text);border:none;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-fab);z-index:12;cursor:pointer;overflow:hidden}
  @media (min-width:768px){ .fab{right:calc(50% - (var(--app-max-width) / 2) + 20px)} }
  .viewmode-cards{display:flex;gap:10px;margin:-16px 0 0;padding:16px 0;position:sticky;top:-16px;z-index:5;background:var(--bg)}
  .viewmode-card{width:76px;height:76px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);position:relative;overflow:hidden}
  .viewmode-card.active{background:color-mix(in srgb, var(--accent) 14%, transparent);border-color:var(--accent);color:var(--accent)}

  /* ---------- 標籤 ---------- */
  .tag-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--tag-color, var(--muted));margin-bottom:6px}
  .tag-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tag-color, var(--muted));flex-shrink:0}
  .tag-picker{display:flex;gap:8px;flex-wrap:wrap}
  .tag-pick-chip{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--tag-color);color:var(--tag-color);cursor:pointer;background:color-mix(in srgb, var(--tag-color) 10%, transparent)}
  .tag-pick-chip.selected{background:var(--tag-color);color:#fff}
  .preset-chip-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .preset-chip-row::-webkit-scrollbar{display:none}
  .preset-chip{flex-shrink:0;white-space:nowrap;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:var(--panel2)}
  .preset-chip:active{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);border-color:var(--accent)}
  .color-swatches{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .color-swatch.selected{border-color:var(--text)}
  .icon-btn{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}

  /* ---------- 底部彈出選單／彈窗 ---------- */
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:var(--app-max-width);max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:6px 0 max(10px, env(safe-area-inset-bottom))}
  .sheet-title{padding:14px 20px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet-item{display:block;width:100%;text-align:center;padding:16px;font-size:15px;color:var(--text);background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit}
  .sheet-item.danger{color:var(--red)}
  .sheet-item.cancel{border-bottom:none;color:var(--muted);font-weight:700;margin-top:6px}
  .copy-modal .cal-grid{grid-auto-rows:38px}

  /* ---------- 登入畫面 ---------- */
  .auth-wrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:32px 28px}
  .auth-wrap .brand-mark{width:44px;height:44px;border:2px solid var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);margin-bottom:20px}
  .auth-wrap .brand-mark span{transform:rotate(-45deg);font-family:'Chakra Petch';font-weight:700;color:var(--accent)}
  .auth-wrap h1{font-family:'Chakra Petch';font-size:22px;margin:0 0 4px;font-weight:700}
  .auth-wrap p.sub{margin:0 0 26px;font-size:12.5px;color:var(--muted)}
  .auth-switch{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
  .auth-switch b{color:var(--accent);cursor:pointer}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-family:'JetBrains Mono';font-size:12px}

  /* ---------- 下拉重新整理 ---------- */
  .pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);width:100%;max-width:var(--app-max-width);display:flex;justify-content:center;align-items:center;padding:14px 0;z-index:50;pointer-events:none;transition:none}
  .pull-indicator .spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%}
  .pull-indicator .spinner.spin{animation:pullspin .7s linear infinite}
  @keyframes pullspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading">載入中…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult,
  GoogleAuthProvider, signOut,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, collection,
  query, where, orderBy, onSnapshot, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// ------------------------------------------------------------
// Firebase 設定：共用衛生營系統（medical-battalion-tracker）專案
// ------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDHJ_ZVLwl9-bD-ZPCTsBcfSjK1A15oJN4",
  authDomain: "medical-battalion-tracker.firebaseapp.com",
  projectId: "medical-battalion-tracker",
  storageBucket: "medical-battalion-tracker.firebasestorage.app",
  messagingSenderId: "442272611220",
  appId: "1:442272611220:web:88ef96f7789200c27ded81",
};

const BUILD_VERSION = "2026-08-02.14";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functionsClient = getFunctions(app);
const googleProvider = new GoogleAuthProvider();

// 處理 Google signInWithRedirect 回跳後的結果；失敗時記錄下來，登入頁渲染時顯示給使用者看
getRedirectResult(auth).catch((e) => {
  console.error("Google 登入失敗", e);
  gateErrorText = `Google 登入失敗（${e.code || e.message}）`;
  if (document.getElementById("authMsg")) {
    document.getElementById("authMsg").innerHTML = `<div class="msg error">${gateErrorText}</div>`;
  }
});

// 本系統獨立 collection（避免與衛生營原系統資料衝突）
const COL_REQUESTS = "forward_support_requests";
const COL_ASSIGNMENTS = "forward_support_assignments";
const COL_UNITS = "forward_support_units";
const COL_TAGS = "forward_support_tags";
const COL_PRESETS = "forward_support_task_presets";
const COL_APPLICANT_PROFILES = "forward_support_applicant_profiles";

// 已派遣（調度員已填好車長／駕駛）的任務，若任務時間已經過了，顯示上改叫「任務完成」，
// 但底層 status 欄位維持 "filled" 不變，不需要額外的狀態或 Firestore 規則異動。
function statusDisplayLabel(r) {
  if (r.status === "filled") {
    const end = r.taskEndTime && (r.taskEndTime.toDate ? r.taskEndTime.toDate() : new Date(r.taskEndTime));
    if (end && end < new Date()) return "任務完成";
  }
  return STATUS_LABEL[r.status] || r.status;
}

// Auth 狀態監聽
// ------------------------------------------------------------
onAuthStateChanged(auth, async (user) => {
  if (suppressAuthGate) return; // 申請單位註冊流程進行中，交給那段流程自己收尾
  if (unsubRequests) { unsubRequests(); unsubRequests = null; }
  currentUser = user;
  if (!user) { profile = null; renderLogin(); return; }

  // 申請單位帳號用獨立的合成 email（單位代碼@fsr.local），資料存在專屬的
  // forward_support_applicant_profiles 集合，跟衛生營系統共用的 users 集合完全分開。
  const isApplicantAccount = (user.email || "").endsWith("@" + APPLICANT_EMAIL_DOMAIN);
  const profileCollection = isApplicantAccount ? COL_APPLICANT_PROFILES : "users";

  let snap;
  try {
    snap = await getDoc(doc(db, profileCollection, user.uid));
  } catch (e) {
    gateErrorText = `讀取帳號資料失敗：${e.code || e.message}（可能是 Firestore 規則還沒設定好）`;
    await signOut(auth);
    return; // signOut 會觸發 onAuthStateChanged(null)，由那次呼叫負責畫面重繪
  }

  if (!snap.exists()) {
    gateErrorText = isApplicantAccount ? "找不到這個申請單位帳號的資料，請重新註冊一次" : "找不到此帳號的角色設定，請聯絡管理者加上 fsr_role 欄位";
    await signOut(auth);
    return;
  }
  profile = snap.data();
  if (!profile.fsr_role) {
    gateErrorText = "這個帳號還沒被設定 fsr_role";
    await signOut(auth);
    return;
  }
  if (profile.fsr_role === "applicant") {
    gateErrorText = null;
    bootRoleApp();
    return;
  }
  if (!VALID_INTERNAL_ROLES.includes(profile.fsr_role)) {
    gateErrorText = `fsr_role 欄位值「${escapeHtml(profile.fsr_role)}」不是合法角色，請確認拼字是否正確（dispatcher／battalion_hq／company1／company2／admin）`;
    await signOut(auth);
    return;
  }
  gateErrorText = null;
  bootRoleApp();
});

// ---- 申請單位：單位代碼 → 內部合成 email（Firebase Auth 需要 email 格式帳號）----
function unitCodeToEmail(code) {
  return code.trim().toLowerCase().replace(/[^a-z0-9]/g, "") + "@" + APPLICANT_EMAIL_DOMAIN;
}

function applicantAuthErrorText(e) {
  const code = (e && e.code) || "";
  if (code.includes("email-already-in-use")) return "這個單位代碼已經註冊過了，請直接登入";
  if (code.includes("weak-password")) return "密碼太簡單，請至少 6 碼";
  if (code.includes("wrong-password") || code.includes("invalid-credential") || code.includes("invalid-login-credentials")) return "單位或密碼錯誤";
  if (code.includes("user-not-found")) return "查無此單位帳號，請確認是否已註冊";
  if (code.includes("too-many-requests")) return "嘗試次數過多，請稍後再試";
  if (code.includes("operation-not-allowed")) return "系統尚未開通申請單位登入方式，請聯絡管理者";
  return (e && e.message) || "發生未知錯誤";
}

async function loadUnitDirectoryIntoSelect(selectId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  try {
    const snap = await getDocs(query(collection(db, COL_UNITS), orderBy("name")));
    const units = snap.docs.map(d => d.data());
    sel.innerHTML = units.length === 0
      ? `<option value="">目前還沒有已註冊的單位，請先註冊</option>`
      : `<option value="">請選擇單位</option>` + units.map(u => `<option value="${escapeHtml(u.code)}">${escapeHtml(u.code)} - ${escapeHtml(u.name)}</option>`).join("");
  } catch (e) {
    sel.innerHTML = `<option value="">單位清單載入失敗</option>`;
  }
}

async function doApplicantLogin() {
  const msg = document.getElementById("authMsg");
  const code = document.getElementById("alUnit").value;
  const password = document.getElementById("alPassword").value;
  if (!code || !password) { msg.innerHTML = `<div class="msg error">請選擇單位並輸入密碼</div>`; return; }
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">登入中…</div>`;
  try {
    await signInWithEmailAndPassword(auth, unitCodeToEmail(code), password);
  } catch (e) {
    msg.innerHTML = `<div class="msg error">登入失敗：${applicantAuthErrorText(e)}</div>`;
  }
}

  const area = document.getElementById("fpContactArea");
  if (!area) return;
  area.innerHTML = `<p style="font-size:11px;color:var(--muted)">查詢聯絡窗口中…</p>`;
  try {
    const snap = await getDoc(doc(db, COL_CONTACT, "main"));
    const c = snap.exists() ? snap.data() : {};
    if (!c.name && !c.phoneCivilian && !c.phoneMilitary) {
      area.innerHTML = `<p style="font-size:11px;color:var(--muted)">尚未設定聯絡窗口，請洽系統管理員</p>`;
      return;

      c.phoneCivilian ? "民線｜" + escapeHtml(c.phoneCivilian) : "",
      c.phoneMilitary ? "軍線｜" + escapeHtml(c.phoneMilitary) : "",
    ].filter(Boolean).join("，");
    area.innerHTML = `<p style="font-size:11px;color:var(--muted)">單位代碼或手機號碼對不上的話，請洽業務承辦人：${escapeHtml(c.rank || "")} ${escapeHtml(c.name || "")}${lines ? "，" + lines : ""}</p>`;

    area.innerHTML = `<p style="font-size:11px;color:var(--muted)">聯絡窗口查詢失敗：${escapeHtml(e.message)}</p>`;
  }

async function doSelfResetApplicantPassword() {
  const msg = document.getElementById("authMsg");
  const unitCode = document.getElementById("fpUnit").value;
  const phone = document.getElementById("fpPhone").value.trim();
  const newPassword = document.getElementById("fpNewPassword").value;
  if (!unitCode || !phone) { msg.innerHTML = `<div class="msg error">請選擇單位並輸入登記的手機號碼</div>`; return; }
  if (!newPassword || newPassword.length < 6) { msg.innerHTML = `<div class="msg error">新密碼至少需要 6 碼</div>`; return; }
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">驗證中…</div>`;
  try {
    const call = httpsCallable(functionsClient, "selfResetApplicantPassword");
    await call({ unitCode, phone, newPassword });
    msg.innerHTML = `<div class="msg ok">密碼已重設，請用新密碼登入</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg error">${escapeHtml(e.message || "驗證失敗")}</div>`;
  }

async function doApplicantRegister() {
  const msg = document.getElementById("authMsg");
  const code = document.getElementById("arCode").value.trim();
  const unitName = document.getElementById("arUnitName").value.trim();
  const rank = document.getElementById("arRank").value.trim();
  const name = document.getElementById("arName").value.trim();
  const phone = document.getElementById("arPhone").value.trim();
  const lineId = document.getElementById("arLineId").value.trim();
  const password = document.getElementById("arPassword").value;
  if (!code || !unitName || !rank || !name || !phone || !password) { msg.innerHTML = `<div class="msg error">請完整填寫必填欄位</div>`; return; }
  if (password.length < 6) { msg.innerHTML = `<div class="msg error">密碼至少需要 6 碼</div>`; return; }
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">註冊中…</div>`;
  let cred = null;
  try {
    const email = unitCodeToEmail(code);
    suppressAuthGate = true;
    try {
      cred = await createUserWithEmailAndPassword(auth, email, password);
    } catch (createErr) {
      if (createErr.code !== "auth/email-already-in-use") throw createErr;
      // 帳號已經存在：可能真的是別人（或自己）已經完整註冊過，也可能是
      // 之前規則還沒貼好、或還沒搬到新集合時留下的孤兒帳號（forward_support_units
      // 目錄裡有紀錄，但 forward_support_applicant_profiles 這份資料不存在）。
      // 不直接擋掉，用剛輸入的密碼試著登入接手：密碼對的話會把缺少的 profile
      // 補回去；密碼錯的話會在 catch 區塊顯示「單位或密碼錯誤」。
      cred = await signInWithEmailAndPassword(auth, email, password);
    }
    currentUser = cred.user;
    const newProfile = {
      email, fsr_role: "applicant", fsr_unitName: unitName,
      unitCode: code, contactRank: rank, contactName: name, contactPhone: phone, contactLineId: lineId, createdAt: serverTimestamp(),
    };
    await setDoc(doc(db, COL_APPLICANT_PROFILES, cred.user.uid), newProfile);
    // 單位目錄只在第一次建立時寫入：規則只允許 create、不允許申請單位自己
    // update 既有的目錄項目，孤兒帳號復原時這筆通常已經存在，跳過避免被規則擋下來。
    const unitDirDoc = await getDoc(doc(db, COL_UNITS, code));
    if (!unitDirDoc.exists()) {
      await setDoc(doc(db, COL_UNITS, code), { code, name: unitName, createdAt: serverTimestamp() });
    }
    profile = newProfile;
    gateErrorText = null;
    bootRoleApp();
  } catch (e) {
    msg.innerHTML = `<div class="msg error">註冊失敗：${applicantAuthErrorText(e)}</div>`;
    // 帳號已建立但後續寫入失敗（例如規則還沒貼好），先登出避免卡在「已登入但沒有資料」的狀態
    if (cred) {
      try { await signOut(auth); } catch (_) {}
      currentUser = null;
    }
  } finally {
    suppressAuthGate = false;
  }
}

async function doLogin() {
  const msg = document.getElementById("authMsg");
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">開啟 Google 登入中…</div>`;
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (e) {
    console.error("signInWithPopup 失敗", e);
    // 部分瀏覽器（尤其部分 Android WebView）會擋 popup，退回用 redirect 方式
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (e2) {
        msg.innerHTML = `<div class="msg error">登入失敗：${authErrorText(e2)}</div>`;
        return;
      }
    }
    msg.innerHTML = `<div class="msg error">登入失敗：${authErrorText(e)}</div>`;
  }
}

function authErrorText(e) {
  const code = e && e.code || "";
  if (code.includes("popup-closed-by-user") || code.includes("cancelled-popup-request")) return "登入已取消";
  return e.message || "發生未知錯誤";
}

function renderHomeView() {
  const c = document.getElementById("content");

function filterTasksBySearch(list, q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return list;
  return list.filter(r =>
    (r.taskName || "").toLowerCase().includes(needle) ||
    (r.applicantUnit || "").toLowerCase().includes(needle) ||
    (r.location || "").toLowerCase().includes(needle) ||
    (r.id || "").toLowerCase().includes(needle)
  );
}

// 本週橫向小行事曆（週日～週六），點日期篩選下面「本週任務」清單只顯示那天，
// 再點一次取消篩選——沿用「任務」頁行事曆的 .cal-* 樣式，只是縮成一排。
function weekStripHtml(weekTasks) {
  const now = new Date();
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  const byDate = {};
  weekTasks.forEach(r => {
    const key = fmtDateKey(tsToDate(r.taskStartTime));
    (byDate[key] = byDate[key] || []).push(r);
  });
  const todayKey = fmtDateKey(now);
  let cells = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + i);
    const key = fmtDateKey(d);
    const count = (byDate[key] || []).length;
    cells += `<div class="cal-cell ${key===todayKey?"today":""} ${key===homeWeekSelectedDate?"selected":""}" data-date="${key}">
      <span class="daynum">${d.getDate()}</span>
      ${count > 0 ? `<span class="dot"></span>` : ""}
    </div>`;
  }
  return `
    <div class="cal-weekdays">${["日","一","二","三","四","五","六"].map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-grid" id="homeWeekStrip" style="margin-bottom:14px">${cells}</div>`;
}

function bindHomeCardActions(list) {

// 只重畫統計/結果區，不動搜尋框本身（換掉 input 的 DOM 節點會讓打字打到一半
// 失焦、游標跳掉）——首頁隨 Firestore 即時更新時（watchRequestsForDispatcher）
// 呼叫這支，不是整頁 renderHomeView()。
function drawHomeResults() {
  const statsArea = document.getElementById("homeStatsArea");
  const resultsArea = document.getElementById("homeResultsArea");
  if (!statsArea || !resultsArea) return;

  const needsAction = allRequests.filter(r => ["pending","reviewing","approved"].includes(r.status));
  const weekTasks = allRequests.filter(r => r.taskStartTime && isThisWeek(tsToDate(r.taskStartTime)));

  const q = homeSearchQuery.trim();
  if (q) {
    const results = filterTasksBySearch(allRequests, q);
    statsArea.innerHTML = "";
    resultsArea.innerHTML = `<div class="section-lbl">搜尋結果・共 ${results.length} 筆</div>` +
      (results.length === 0 ? `<div class="empty">找不到符合的任務</div>` : results.map(r => taskCardHtml(r, true)).join(""));
    bindCardMenu(resultsArea);
    bindHomeCardActions(results);
    return;
  }

  // 各單位本週任務量，給承辦人分派時參考哪個單位這週比較吃緊；只算已經
  // 分發出去的（assignedUnit 有值），待審核/審核中還沒分單位的不計入。
  const unitCounts = { hq: 0, co1: 0, co2: 0 };
  weekTasks.forEach(r => { if (r.assignedUnit && unitCounts[r.assignedUnit] !== undefined) unitCounts[r.assignedUnit]++; });

  statsArea.innerHTML = `
    <div class="stats">
      <div class="stat amber"><div class="n">${needsAction.length}</div><div class="l">待處理</div></div>
      <div class="stat blue"><div class="n">${weekTasks.length}</div><div class="l">本週任務</div></div>
    </div>
    <div class="unit-load-row">
      ${Object.keys(REAL_UNIT_LABEL).map(k => `<div class="unit-load-chip"><span class="n">${unitCounts[k]}</span><span class="l">${REAL_UNIT_LABEL[k]}</span></div>`).join("")}
    </div>`;

  const pendingHtml = needsAction.length === 0
    ? `<div class="empty">目前沒有待處理任務</div>`
    : needsAction.map(r => taskCardHtml(r, true)).join("");

  const weekListFiltered = homeWeekSelectedDate
    ? weekTasks.filter(r => fmtDateKey(tsToDate(r.taskStartTime)) === homeWeekSelectedDate)
    : weekTasks;
  const weekHtml = weekListFiltered.length === 0
    ? `<div class="empty">${homeWeekSelectedDate ? "這天沒有排定的任務" : "本週目前沒有排定的任務"}</div>`
    : weekListFiltered.map(r => taskCardHtml(r, false)).join("");

  resultsArea.innerHTML =
    `<div class="section-lbl">待處理</div>${pendingHtml}` +
    `<div class="section-lbl" style="margin-top:22px">本週任務</div>` +
    weekStripHtml(weekTasks) +
    weekHtml;

  bindCardMenu(resultsArea);
  bindHomeCardActions(needsAction);
  document.querySelectorAll("#homeWeekStrip [data-date]").forEach(el => {
    el.onclick = () => { homeWeekSelectedDate = (homeWeekSelectedDate === el.dataset.date) ? null : el.dataset.date; drawHomeResults(); };
  });
}

function tsToDate(ts) { return ts.toDate ? ts.toDate() : new Date(ts); }

// ---- 共用：日期 + 半小時時間選單（iOS Safari 的原生 datetime-local 選擇器不會照 step
// 限制分鐘，只能自己拆成日期輸入框 + 半小時一格的下拉選單，強制卡在整點/半點）----
function toDateValue(d) {
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function toHalfHourTimeValue(d) {
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getHours())}:${d.getMinutes() < 30 ? "00" : "30"}`;
}
function halfHourTimeOptionsHtml(selected) {
  let html = `<option value="">請選擇時間</option>`;
  for (let h = 0; h < 24; h++) {
    for (const m of [0, 30]) {
      const v = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
      html += `<option value="${v}"${v === selected ? " selected" : ""}>${v}</option>`;
    }
  }
  return html;
}
function isThisWeek(d) {
  const now = new Date();
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
  return d >= startOfWeek && d < endOfWeek;
}
function isThisMonth(d) {
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}
function isToday(d) {
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

let calendarMonth = new Date();
let selectedCalendarDate = null;

function fmtDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

function renderCalendarView() {
  const c = document.getElementById("taskViewArea");
  const y = calendarMonth.getFullYear(), m = calendarMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  const byDate = {};
  allRequests.forEach(r => {
    if (!r.taskStartTime) return;
    const d = r.taskStartTime.toDate ? r.taskStartTime.toDate() : new Date(r.taskStartTime);
    const key = fmtDateKey(d);
    (byDate[key] = byDate[key] || []).push(r);
  });

  const todayKey = fmtDateKey(new Date());
  let cellsHtml = "";
  for (let i = 0; i < startWeekday; i++) cellsHtml += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const count = (byDate[key] || []).length;
    cellsHtml += `<div class="cal-cell ${key===todayKey?"today":""} ${key===selectedCalendarDate?"selected":""}" data-date="${key}">
      <span class="daynum">${day}</span>
      ${count > 0 ? `<span class="dot"></span>` : ""}
    </div>`;

function drawRecordsList() {
  document.querySelectorAll(".tabs [data-recfilter]").forEach(el => el.classList.toggle("active", el.dataset.recfilter === recordFilter));
  const customRange = document.getElementById("recordCustomRange");
  if (customRange) customRange.style.display = recordFilter === "custom" ? "flex" : "none";
  const area = document.getElementById("recordListArea");
  if (!area) return;
  let list = allRequests;
  if (recordFilter === "today") list = list.filter(r => r.taskStartTime && isToday(tsToDate(r.taskStartTime)));
  else if (recordFilter === "week") list = list.filter(r => r.taskStartTime && isThisWeek(tsToDate(r.taskStartTime)));
  else if (recordFilter === "month") list = list.filter(r => r.taskStartTime && isThisMonth(tsToDate(r.taskStartTime)));
  else if (recordFilter === "custom") {
    const start = recordCustomStart ? new Date(`${recordCustomStart}T00:00:00`) : null;
    const end = recordCustomEnd ? new Date(`${recordCustomEnd}T23:59:59`) : null;
    list = list.filter(r => {
      if (!r.taskStartTime) return false;
      const d = tsToDate(r.taskStartTime);
      return (!start || d >= start) && (!end || d <= end);
    });
  }
  area.innerHTML = list.length === 0
    ? `<div class="empty">這個範圍內沒有任務紀錄</div>`
    : list.map(r => taskCardHtml(r, false)).join("");
  bindCardMenu(area);
}

// ---- 共用：新增／編輯任務表單的「申請單位」選取器 ----
// 從已註冊的申請單位目錄（forward_support_units）挑選，選到已註冊單位時
// 會記住單位代碼（供 forward_support_requests.applicantUnitCode 使用，讓
// 該單位登入後在「我的申請」也看得到這筆——不只是看自己送出的）；找不到
// 對應單位（還沒註冊，或本來就是一次性/未註冊的申請單位）時選「其他」，
// 沿用原本自由輸入文字的行為，不記單位代碼。
async function loadApplicantUnitPicker(selectId, textId, presetCode) {
  const sel = document.getElementById(selectId);
  const textInput = document.getElementById(textId);
  let units = [];
  try {
    const snap = await getDocs(query(collection(db, COL_UNITS), orderBy("name")));
    units = snap.docs.map(d => d.data());
  } catch (e) { /* 目錄載入失敗仍可手動輸入，不擋住整個表單 */ }
  sel.innerHTML = `<option value="">請選擇單位</option>`
    + units.map(u => `<option value="${escapeHtml(u.code)}">${escapeHtml(u.code)} - ${escapeHtml(u.name)}</option>`).join("")
    + `<option value="__other__">其他（尚未註冊的單位，手動輸入）</option>`;
  sel.onchange = () => {
    if (sel.value === "__other__") {
      textInput.style.display = "";
      textInput.value = "";
      textInput.focus();
    } else if (sel.value === "") {
      textInput.style.display = "none";
      textInput.value = "";
    } else {
      const u = units.find(x => x.code === sel.value);
      textInput.style.display = "none";
      textInput.value = u ? u.name : "";
    }
  };
  if (presetCode && units.some(u => u.code === presetCode)) {
    sel.value = presetCode;
    sel.onchange();
  } else if (textInput.value) {
    // 既有文字對不到任何已註冊單位代碼（自由輸入的舊資料），選「其他」並保留原文字。
    sel.value = "__other__";
    textInput.style.display = "";
  } else {
    textInput.style.display = "none";
  }
}

function selectedApplicantUnitCode(selectId) {
  const val = document.getElementById(selectId).value;
  return (val && val !== "__other__") ? val : null;
}

    applicantAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeSection === "more" && moreSection === "accounts") drawAccountsList();
  }, (e) => {
    c.innerHTML = `<div class="msg error">讀取失敗：${e.message}（可能是 Firestore 規則還沒設定好）</div>`;
  });

  if (unsubInternalAccounts) unsubInternalAccounts();
  const q2 = query(collection(db, "users"), where("fsr_role", "in", ["dispatcher","battalion_hq","company1","company2","admin"]));
  unsubInternalAccounts = onSnapshot(q2, (snap) => {
    internalAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeSection === "more" && moreSection === "accounts") drawAccountsList();
  });
}

async function shareOrCopyLink(url, title) {
  if (navigator.share) {
    try { await navigator.share({ title, url }); } catch (e) { /* 使用者取消分享，不算錯誤 */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    alert("已複製連結到剪貼簿");
  } catch (e) {
    alert("複製失敗，請手動複製：" + url);
  }
}

function renderRolePreviewDetail(roleKey) {
  previewRoleKey = roleKey;
  const c = document.getElementById("content");
  const isUnitRole = roleKey !== "dispatcher";
  let bodyHtml;
  let pending = [], done = [];
  if (!isUnitRole) {
    const list = allRequests.filter(r => ["pending","reviewing","approved"].includes(r.status));
    bodyHtml = list.length === 0
      ? `<div class="empty">目前沒有待處理任務</div>`
      : list.map(r => taskCardHtml(r, false, false)).join("");
  } else {
    const label = unitKeyToLabel(roleKey);
    const unitRequests = allRequests.filter(r => r.assignedUnit === label);
    pending = unitRequests.filter(r => r.status === "assigned");
    done = unitRequests.filter(r => r.status === "filled");
    bodyHtml = `
      <div class="section-lbl">待填寫</div>
      ${pending.length === 0 ? `<div class="empty">目前沒有任務</div>` : pending.map(r => taskCardHtml(r, false, true)).join("")}
      <div class="section-lbl" style="margin-top:18px">已完成</div>
      ${done.length === 0 ? `<div class="empty">目前沒有任務</div>` : done.map(r => taskCardHtml(r, false, true)).join("")}`;
  }
  c.innerHTML = `
    <button class="icon-btn" id="backFromRolePreviewDetail" aria-label="返回" style="margin-bottom:14px">${ICON_BACK}</button>
    <div class="section-lbl">角色預覽・${ROLE_LABEL[roleKey]}${isUnitRole ? "（可代為填寫）" : "（唯讀）"}</div>
    ${bodyHtml}`;
  document.getElementById("backFromRolePreviewDetail").onclick = renderRolePreviewMenu;
  if (isUnitRole) {
    [...pending, ...done].forEach(r => {
      const fillBtn = document.getElementById(`fill-${r.id}`);
      if (fillBtn) fillBtn.onclick = () => openFillForm(r, roleKey);
      const editFillBtn = document.getElementById(`editfill-${r.id}`);
      if (editFillBtn) editFillBtn.onclick = () => openEditFillForm(r, roleKey);
    });
  }
}

async function doAddTag(getColor) {
  const nameInput = document.getElementById("newTagName");
  const name = nameInput.value.trim();
  const msg = document.getElementById("tagMsg");
  if (!name) { msg.innerHTML = `<div class="msg error">請輸入標籤名稱</div>`; return; }
  try {
    await addDoc(collection(db, COL_TAGS), { name, color: getColor(), createdAt: serverTimestamp() });
    msg.innerHTML = `<div class="msg ok">已新增標籤</div>`;
    nameInput.value = "";
  } catch (e) { msg.innerHTML = `<div class="msg error">新增失敗：${e.message}</div>`; }
}

async function saveTagNow(id, name, getColor) {
  if (!name) { alert("標籤名稱不能空白"); return; }
  try {
    await updateDoc(doc(db, COL_TAGS, id), { name, color: getColor() });
    alert("已更新標籤");
  } catch (e) { alert("更新失敗：" + e.message); }
}

async function deleteTagNow(id) {
  if (!confirm("確定要刪除這個標籤嗎？已經套用這個標籤的任務不會被刪除，只是標籤定義被移除。")) return;
  try { await deleteDoc(doc(db, COL_TAGS, id)); } catch (e) { alert("刪除失敗：" + e.message); }
}

async function deleteApplicantAccount(a) {
  const name = a.fsr_unitName || a.email || a.id;
  if (!confirm(`確定要刪除「${name}」這個申請單位帳號嗎？刪除後對方會無法登入，需要重新註冊；單位代碼會被完全釋出，可以再被別人（或同一單位）拿去註冊。這個動作無法復原。`)) return;
  try {
    // 先刪底層 Firebase Auth 帳號（Admin SDK 才能刪別人的帳號，前端做不到），
    // 成功了才刪 Firestore 資料——順序反過來的話，如果 Auth 刪除失敗，會留下
    // Firestore 資料都清空、但 Auth 帳號還在的狀況，單位代碼一樣卡住沒釋出，
    // 等於沒修到問題。
    const call = httpsCallable(functionsClient, "deleteApplicantAuthAccount");
    await call({ targetUid: a.id });
    await deleteDoc(doc(db, COL_APPLICANT_PROFILES, a.id));
    if (a.unitCode) {
      try { await deleteDoc(doc(db, COL_UNITS, a.unitCode)); } catch (e) { /* 單位目錄刪不掉不擋主流程，帳號本身已經刪除生效 */ }
    }
    editingApplicantId = null;
  } catch (e) { alert("刪除失敗：" + e.message); }
}

// 密碼是雜湊過的，前端／後端都讀不出原本的密碼，只能透過 Cloud Function
// （resetApplicantPassword，用 Admin SDK 權限）直接覆蓋成一組新密碼。
async function doResetApplicantPassword(a) {
  const msg = document.getElementById(`resetpwMsg-${a.id}`);
  const newPassword = document.getElementById(`newpw-${a.id}`).value;
  if (!newPassword || newPassword.length < 6) {
    msg.innerHTML = `<div class="msg error">新密碼至少需要 6 碼</div>`;
    return false;
  }
  msg.innerHTML = `<div style="font-size:11px;color:var(--muted)">設定中…</div>`;
  try {
    const call = httpsCallable(functionsClient, "resetApplicantPassword");
    await call({ targetUid: a.id, newPassword });
    return true;
  } catch (e) {
    msg.innerHTML = `<div class="msg error">重設失敗：${e.message}</div>`;
    return false;
  }
}

// ---- 複製到其他日期（多選行事曆，跟原本的複製到多天） ----
let copySourceTask = null;
let copySelectedDates = new Set();
let copyCalMonth = new Date();

function openCopyToDatesModal(task) {
  copySourceTask = task;
  copySelectedDates = new Set();
  copyCalMonth = new Date();
  renderCopyModal();
}

function closeCopyModal() {
  const overlay = document.getElementById("copyModalOverlay");
  if (overlay) overlay.remove();
  copySourceTask = null;
}

function renderCopyModal() {
  let overlay = document.getElementById("copyModalOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.className = "sheet-overlay";
    overlay.id = "copyModalOverlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCopyModal(); });
  }
  const y = copyCalMonth.getFullYear(), m = copyCalMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayKey = fmtDateKey(new Date());
  let cellsHtml = "";
  for (let i = 0; i < startWeekday; i++) cellsHtml += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const sel = copySelectedDates.has(key);
    cellsHtml += `<div class="cal-cell ${key===todayKey?"today":""} ${sel?"selected":""}" data-date="${key}"><span class="daynum">${day}</span></div>`;
  }
  overlay.innerHTML = `
    <div class="sheet copy-modal">
      <div class="sheet-title">複製「${escapeHtml(copySourceTask.taskName || copySourceTask.location || "")}」到其他日期</div>
      <div style="padding:14px 20px 0">
        <div class="cal-header">
          <button class="cal-nav" id="copyCalPrev">‹</button>
          <div class="cal-title">${y} 年 ${m+1} 月</div>
          <button class="cal-nav" id="copyCalNext">›</button>
        </div>
        <div class="cal-weekdays">${["日","一","二","三","四","五","六"].map(w=>`<div>${w}</div>`).join("")}</div>
        <div class="cal-grid">${cellsHtml}</div>
        <p style="font-size:11px;color:var(--muted);margin:10px 0 0">點選日期可複選，會保留原任務的時間長度</p>
      </div>
      <div style="padding:16px 20px">
        <div class="btn-row">
          <button class="btn btn-outline" id="copyCancelBtn">取消</button>
          <button class="btn btn-primary" id="copyConfirmBtn">複製到已選日期（${copySelectedDates.size}）</button>
        </div>
      </div>
    </div>`;
  document.getElementById("copyCalPrev").onclick = () => { copyCalMonth = new Date(y, m-1, 1); renderCopyModal(); };
  document.getElementById("copyCalNext").onclick = () => { copyCalMonth = new Date(y, m+1, 1); renderCopyModal(); };
  document.querySelectorAll("#copyModalOverlay .cal-cell[data-date]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.date;
      if (copySelectedDates.has(k)) copySelectedDates.delete(k); else copySelectedDates.add(k);
      renderCopyModal();
    };
  });
  document.getElementById("copyConfirmBtn").onclick = doCopyToDates;
  document.getElementById("copyCancelBtn").onclick = closeCopyModal;
}

async function doCopyToDates() {
  if (copySelectedDates.size === 0) { alert("請至少選一個日期"); return; }
  const src = copySourceTask;
  const btn = document.getElementById("copyConfirmBtn");
  btn.disabled = true; btn.textContent = "複製中…";
  const startBase = tsToDate(src.taskStartTime);
  const endBase = tsToDate(src.taskEndTime);
  const durationMs = endBase - startBase;
  try {
    for (const key of copySelectedDates) {
      const [yy, mm, dd] = key.split("-").map(Number);
      const newStart = new Date(yy, mm - 1, dd, startBase.getHours(), startBase.getMinutes());
      const newEnd = new Date(newStart.getTime() + durationMs);
      await addDoc(collection(db, COL_REQUESTS), {
        taskName: src.taskName || "",
        applicantUnit: src.applicantUnit || "", applicantUnitCode: src.applicantUnitCode || null,
        applicantRank: src.applicantRank || "", applicantName: src.applicantName || "",
        location: src.location || "",
        taskStartTime: newStart, taskEndTime: newEnd,
        remarks: src.remarks || "",
        tagId: src.tagId || null, tagName: src.tagName || null, tagColor: src.tagColor || null,
        status: src.status, assignedUnit: src.assignedUnit || null,
        createdAt: serverTimestamp(),
        createdBy: currentUser.uid,
        createdByDispatcher: true,
        reviewedBy: src.reviewedBy || null,
        reviewedAt: src.reviewedAt || null,
      });
    }
    closeCopyModal();
  } catch (e) {
    alert("複製失敗：" + e.message);
    btn.disabled = false; btn.textContent = `複製到已選日期（${copySelectedDates.size}）`;
  }
}

let fillTargetTask = null;
let fillTargetDocId = null;
let fillTargetRoleKey = null;
let fillAllPersonnel = [];
let fillAllVehicles = [];
let fillOwnUnit = null;

function fillPersonnelPool(crossUnit) {
  return crossUnit ? fillAllPersonnel : fillAllPersonnel.filter(u => u.unit === fillOwnUnit);
}

function vehicleSortKey(label) {
  const m = label.match(/\d+/);
  return m ? parseInt(m[0], 10) : Infinity;
}

function fillVehiclePool(crossUnit) {
  const base = crossUnit ? fillAllVehicles : fillAllVehicles.filter(v => v.unit === fillOwnUnit);
  return base
    .filter(v => vehicleLabelOf(v).startsWith("軍H"))
    .sort((x, y) => vehicleSortKey(vehicleLabelOf(x)) - vehicleSortKey(vehicleLabelOf(y)));
}

function vehicleOptionHtml(v) {
  const label = vehicleLabelOf(v);
  return `<option value="${escapeHtml(label)}">${escapeHtml(label)}</option>`;
}

function groupedVehicleOptionsHtml(pool, crossUnit) {
  if (!crossUnit) return pool.map(vehicleOptionHtml).join("");
  return Object.keys(REAL_UNIT_LABEL).map(unitKey => {
    const group = pool.filter(v => v.unit === unitKey);
    if (group.length === 0) return "";
    return `<optgroup label="${escapeHtml(REAL_UNIT_LABEL[unitKey])}">${group.map(vehicleOptionHtml).join("")}</optgroup>`;
  }).join("");
}

function renderFillVehicleOptions(presetValue, crossUnit) {
  const vehicleSelect = document.getElementById("fillVehicleSelect");
  const keep = presetValue !== undefined ? presetValue : vehicleSelect.value;
  const pool = fillVehiclePool(crossUnit);
  const labels = pool.map(vehicleLabelOf);
  vehicleSelect.innerHTML = `<option value="">請選擇</option>` + groupedVehicleOptionsHtml(pool, crossUnit) + `<option value="__other__">其他（手動輸入）</option>`;
  if (keep && (labels.includes(keep) || keep === "__other__")) vehicleSelect.value = keep;
}

function personnelOptionHtml(u) {
  return `<option value="${u.id}" data-rank="${escapeHtml(u.rank || "")}" data-name="${escapeHtml(u.displayName || "")}">${escapeHtml(u.rank || "")} ${escapeHtml(u.displayName || "")}</option>`;
}

function groupedPersonnelOptionsHtml(pool, crossUnit) {
  if (!crossUnit) return pool.map(personnelOptionHtml).join("");
  return Object.keys(REAL_UNIT_LABEL).map(unitKey => {
    const group = pool.filter(u => u.unit === unitKey);
    if (group.length === 0) return "";
    return `<optgroup label="${escapeHtml(REAL_UNIT_LABEL[unitKey])}">${group.map(personnelOptionHtml).join("")}</optgroup>`;
  }).join("");
}

function renderFillPersonnelOptions(presetCommanderId, presetDriverId, crossUnit) {
  const commanderSel = document.getElementById("fillCommanderSelect");
  const driverSel = document.getElementById("fillDriverSelect");
  const keepCommander = presetCommanderId !== undefined ? presetCommanderId : commanderSel.value;
  const keepDriver = presetDriverId !== undefined ? presetDriverId : driverSel.value;
  const pool = fillPersonnelPool(crossUnit);
  const commanderPool = pool.filter(u => !SOLDIER_RANKS.includes(u.rank));
  commanderSel.innerHTML = `<option value="">請選擇</option>` + groupedPersonnelOptionsHtml(commanderPool, crossUnit);
  driverSel.innerHTML = `<option value="">請選擇</option>` + groupedPersonnelOptionsHtml(pool, crossUnit);
  if (keepCommander && commanderPool.some(u => u.id === keepCommander)) commanderSel.value = keepCommander;
  if (keepDriver && pool.some(u => u.id === keepDriver)) driverSel.value = keepDriver;
}

async function openFillSheet(r, existingDoc, roleKey) {
  fillTargetTask = r;
  fillTargetDocId = existingDoc ? existingDoc.id : null;
  fillTargetRoleKey = roleKey;
  const a = existingDoc ? existingDoc.data() : {};

  const realUnit = FSR_UNIT_TO_REAL_UNIT[roleKey];
  fillOwnUnit = realUnit;
  fillAllPersonnel = [];
  fillAllVehicles = [];
  try {
    const [uSnap, vSnap] = await Promise.all([
      getDocs(collection(db, "users")),
      getDocs(collection(db, "vehicles")),
    ]);
    fillAllPersonnel = uSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(u => !["unclaimed", "pending", "disabled"].includes(u.role) && u.rank && u.displayName && u.unit)
      .sort((x, y) => rankWeight(x.rank) - rankWeight(y.rank) || (x.displayName || "").localeCompare(y.displayName || "", "zh-Hant"));
    fillAllVehicles = vSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(v => v.unit);
  } catch (e) { /* 查無資料時仍顯示空白下拉選單 */ }

  const matchInAll = (rank, name) => (rank && name) ? fillAllPersonnel.find(u => u.rank === rank && u.displayName === name) : undefined;
  const cmdMatch = matchInAll(a.vehicleCommanderRank, a.vehicleCommanderName);
  const drvMatch = matchInAll(a.driverRank, a.driverName);
  const needsCrossUnit = (cmdMatch && cmdMatch.unit !== fillOwnUnit) || (drvMatch && drvMatch.unit !== fillOwnUnit);

  const vehicleMatch = a.vehicleNumber ? fillAllVehicles.find(v => vehicleLabelOf(v) === a.vehicleNumber) : undefined;
  const needsCrossUnitVehicle = vehicleMatch && vehicleMatch.unit !== fillOwnUnit;
  const initialVehicleValue = a.vehicleNumber ? (vehicleMatch ? a.vehicleNumber : "__other__") : "";

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.id = "fillOverlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-title">${escapeHtml(r.taskName || r.location || "")}</div>
      <div style="padding:16px 20px">
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px">
          <input type="checkbox" id="fillCrossUnitToggle" ${needsCrossUnit ? "checked" : ""}>跨單位選人（顯示所有單位人員）
        </label>
        <div class="field"><label>車長（不含士兵）</label>
          <select id="fillCommanderSelect"></select>
        </div>
        <div class="field"><label>駕駛</label>
          <select id="fillDriverSelect"></select>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px">
          <input type="checkbox" id="fillVehicleCrossUnitToggle" ${needsCrossUnitVehicle ? "checked" : ""}>跨單位選車（顯示所有單位車輛）
        </label>
        <div class="field"><label>車號</label>
          <select id="fillVehicleSelect"></select>
          <input type="text" id="fillVehicleManual" placeholder="手動輸入車號" style="margin-top:8px;display:none">
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" id="fillCancelBtn">取消</button>
          <button class="btn btn-primary" id="fillConfirmBtn">確認送出</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  renderFillPersonnelOptions(cmdMatch ? cmdMatch.id : "", drvMatch ? drvMatch.id : "", needsCrossUnit);
  renderFillVehicleOptions(initialVehicleValue, needsCrossUnitVehicle);

  const vehicleSelect = document.getElementById("fillVehicleSelect");
  const vehicleManual = document.getElementById("fillVehicleManual");
  if (initialVehicleValue === "__other__") {
    vehicleManual.style.display = "block";
    vehicleManual.value = a.vehicleNumber;
  }
  document.getElementById("fillVehicleCrossUnitToggle").onchange = (e) => {
    renderFillVehicleOptions(undefined, e.target.checked);
  };
  vehicleSelect.onchange = () => {
    vehicleManual.style.display = vehicleSelect.value === "__other__" ? "block" : "none";
  };

  document.getElementById("fillCrossUnitToggle").onchange = (e) => {
    renderFillPersonnelOptions(undefined, undefined, e.target.checked);
  };
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeFillSheet(); });
  document.getElementById("fillCancelBtn").onclick = closeFillSheet;
  document.getElementById("fillConfirmBtn").onclick = doFillConfirm;
}

function closeFillSheet() {
  const overlay = document.getElementById("fillOverlay");
  if (overlay) overlay.remove();
  fillTargetTask = null;
  fillTargetDocId = null;
  fillTargetRoleKey = null;
  fillAllPersonnel = [];
  fillAllVehicles = [];
  fillOwnUnit = null;
}

async function doFillConfirm() {
  const r = fillTargetTask;
  if (!r) return;
  const commanderSel = document.getElementById("fillCommanderSelect");
  const driverSel = document.getElementById("fillDriverSelect");
  if (!commanderSel.value || !driverSel.value) { alert("請選擇車長與駕駛"); return; }
  const commanderOpt = commanderSel.selectedOptions[0];
  const driverOpt = driverSel.selectedOptions[0];
  const vehicleSelect = document.getElementById("fillVehicleSelect");
  const vehicleManual = document.getElementById("fillVehicleManual");
  const vehicleNumber = vehicleSelect.value === "__other__" ? vehicleManual.value.trim() : vehicleSelect.value;
  const commanderRank = commanderOpt.dataset.rank, commanderName = commanderOpt.dataset.name;
  const driverRank = driverOpt.dataset.rank, driverName = driverOpt.dataset.name;
  const commanderPerson = fillAllPersonnel.find(u => u.id === commanderSel.value);
  const driverPerson = fillAllPersonnel.find(u => u.id === driverSel.value);
  // 車長／駕駛的證照等級跟手機額外複製一份到任務文件上（不只存在
  // forward_support_assignments），這樣任何看得到這筆任務卡片的人（包含
  // 申請單位自己）才能直接在卡片上看到聯絡方式，不用另外查詢。commanderUid／
  // driverUid 額外存對方在衛生營系統的帳號 uid，供未來衛生營出勤系統比對
  // 「登入的人是不是這筆任務指定的車長／駕駛」時使用，比只比對姓名字串可靠。
  const contactFields = {
    commanderRank, commanderName, commanderUid: (commanderPerson && commanderPerson.id) || null,
    commanderPhone: (commanderPerson && commanderPerson.phone) || "",
    commanderEmtLevel: (commanderPerson && commanderPerson.emtLevel) || "",
    driverRank, driverName, driverUid: (driverPerson && driverPerson.id) || null,
    driverPhone: (driverPerson && driverPerson.phone) || "",
    driverEmtLevel: (driverPerson && driverPerson.emtLevel) || "",
    vehicleNumber,
  };
  try {
    // 兩份文件（forward_support_assignments + forward_support_requests）包成
    // 一個交易，要嘛一起成功要嘛一起失敗。原本是兩個各自獨立的 await，中間
    // 網路斷線的話會出現「填寫紀錄已經新增，但任務狀態沒變成已派遣」的資料
    // 不一致；使用者以為沒送出成功而重按一次，還會因為 fillTargetDocId 還是
    // 空的而多新增一筆重複的填寫紀錄。
    const reqRef = doc(db, COL_REQUESTS, r.id);
    await runTransaction(db, async (tx) => {
      if (fillTargetDocId) {
        tx.update(doc(db, COL_ASSIGNMENTS, fillTargetDocId), {
          vehicleCommanderRank: commanderRank, vehicleCommanderName: commanderName,
          commanderUid: contactFields.commanderUid, driverUid: contactFields.driverUid,
          driverRank, driverName, vehicleNumber,
        });
        tx.update(reqRef, contactFields);
      } else {
        tx.set(doc(collection(db, COL_ASSIGNMENTS)), {
          requestId: r.id, unit: unitKeyToLabel(fillTargetRoleKey),
          vehicleCommanderRank: commanderRank, vehicleCommanderName: commanderName,
          commanderUid: contactFields.commanderUid, driverUid: contactFields.driverUid,
          driverRank, driverName, vehicleNumber,
          filledBy: currentUser.uid, filledAt: serverTimestamp(),
        });
        tx.update(reqRef, { status: "filled", ...contactFields });
      }
    });
    const refreshRoleKey = (activeSection === "more" && moreSection === "rolepreview") ? fillTargetRoleKey : null;
    closeFillSheet();
    if (refreshRoleKey) renderRolePreviewDetail(refreshRoleKey);
  } catch (e) { alert("送出失敗：" + e.message); }
}

// 申請單位看得到的任務分兩種來源合併：自己送出的（createdBy），還有承辦人
// 「新增任務」時幫自己單位登記、選對了單位代碼的（applicantUnitCode）——
// 兩份各自 onSnapshot、依 id 去重合併，避免拿 Firestore 的 or() 查詢處理
// 兩個不同欄位造成額外的複合索引需求。
let applicantReqsByCreator = [];
let applicantReqsByUnit = [];
function mergeApplicantRequests() {
  const map = new Map();
  [...applicantReqsByCreator, ...applicantReqsByUnit].forEach(r => map.set(r.id, r));
  allRequests = Array.from(map.values())
    .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  if (applicantSection === "mine") renderApplicantMineView();
}
function watchRequestsForApplicant() {
  const q1 = query(collection(db, COL_REQUESTS), where("createdBy", "==", currentUser.uid));
  const unsub1 = onSnapshot(q1, (snap) => {
    applicantReqsByCreator = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    mergeApplicantRequests();
  });
  let unsub2 = () => {};
  if (profile.unitCode) {
    const q2 = query(collection(db, COL_REQUESTS), where("applicantUnitCode", "==", profile.unitCode));
    unsub2 = onSnapshot(q2, (snap) => {
      applicantReqsByUnit = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      mergeApplicantRequests();
    });
  }
  unsubRequests = () => { unsub1(); unsub2(); };
}

function taskCardHtml(r, withDispatchActions=false, withFillAction=false) {
  const start = fmtTs(r.taskStartTime), end = fmtTs(r.taskEndTime);
  const tagClass = ["pending","reviewing","approved","assigned","filled"].includes(r.status) ? r.status : "rejected";
  let actions = "";
  if (withDispatchActions && r.status === "pending") {
    actions = `<div class="actions">
      <button class="btn btn-small btn-blue" id="review-${r.id}">開始審核</button>
      <button class="btn btn-small btn-red" id="reject-${r.id}">駁回</button>
    </div>`;
  }
  if (withDispatchActions && r.status === "reviewing") {
    actions = `<div class="actions">
      <button class="btn btn-small btn-green" id="approve-${r.id}">核定</button>
      <button class="btn btn-small btn-red" id="reject-${r.id}">駁回</button>
    </div>`;
  }
  if (withDispatchActions && r.status === "approved") {
    actions = `<div class="actions"><button class="btn btn-small btn-green" id="assign-${r.id}">派遣</button></div>`;
  }
  if (withDispatchActions && r.status === "assigned") {
    actions = `<div class="actions">
      <button class="btn btn-small btn-outline" id="changeunit-${r.id}">換單位</button>
      <button class="btn btn-small btn-red" id="cancelassign-${r.id}">取消分發</button>
    </div>`;
  }
  if (withFillAction && r.status === "assigned") {
    actions = `<div class="actions"><button class="btn btn-small btn-blue" id="fill-${r.id}">填寫車長／駕駛</button></div>`;
  }
  if (withFillAction && r.status === "filled") {
    actions = `<div class="actions"><button class="btn btn-small btn-outline" id="editfill-${r.id}">編輯車長／駕駛</button></div>`;
  }
  if (withDispatchActions && r.status === "filled") {
    actions = `<div class="actions">
      <button class="btn btn-small btn-outline" id="changeunit-${r.id}">換單位</button>
      <button class="btn btn-small btn-red" id="cancelassign-${r.id}">取消分發</button>
    </div>`;
  }
  if (!withFillAction && !withDispatchActions && r.status === "assigned") {
    actions = `<div class="actions"><span class="muted-note">等待派遣人員填寫車長／駕駛</span></div>`;
  }
  return `
    <div class="card" data-taskid="${r.id}">
      <div class="task-top">
        <span class="id">#${(r.id||"").slice(-6).toUpperCase()}</span>
        <span class="tag ${tagClass}">${statusDisplayLabel(r)}${r.assignedUnit ? "・" + assignedUnitLabel(r.assignedUnit) : ""}</span>
      </div>
      ${r.tagName ? `<div class="tag-chip" style="--tag-color:${escapeHtml(r.tagColor || "")}">${escapeHtml(r.tagName)}</div>` : ""}
      <h3>${escapeHtml(r.taskName || r.location || "")}</h3>
      ${r.taskName && r.location ? `<p>地點｜${escapeHtml(r.location)}</p>` : ""}
      <p>申請單位｜${escapeHtml(r.applicantUnit || "")}</p>
      ${(r.applicantRank || r.applicantName) ? `<p>申請人｜${escapeHtml(r.applicantRank || "")} ${escapeHtml(r.applicantName || "")}</p>` : ""}
      ${r.remarks ? `<p>備註｜${escapeHtml(r.remarks)}</p>` : ""}
      <div class="time">${start} — ${end}</div>
      ${r.status === "filled" && r.commanderName ? `
      <div class="person-info">
        <div class="row"><span class="lbl">車長</span><span class="val">${escapeHtml(r.commanderRank || "")} ${escapeHtml(r.commanderName)}<span class="sub">證照 ${escapeHtml(r.commanderEmtLevel || "—")}　手機 ${phoneLinkHtml(r.commanderPhone)}</span></span></div>
        <div class="row"><span class="lbl">駕駛</span><span class="val">${escapeHtml(r.driverRank || "")} ${escapeHtml(r.driverName || "")}<span class="sub">證照 ${escapeHtml(r.driverEmtLevel || "—")}　手機 ${phoneLinkHtml(r.driverPhone)}</span></span></div>
        ${r.vehicleNumber ? `<div class="row"><span class="lbl">車號</span><span class="val">${escapeHtml(r.vehicleNumber)}</span></div>` : ""}
      </div>` : ""}
      ${actions}
    </div>`;
}

function fmtTs(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function displayNameOf(p) {
  if (!p) return "";
  const namePart = (p.rank ? p.rank + " " : "") + (p.displayName || "");
  return namePart.trim() || p.email || "";
}

// ==============================================================
// 下拉重新整理（在頁面最頂端往下拉，放開後重新整理頁面）
// ==============================================================
(function initPullToRefresh() {
  const THRESHOLD = 68;
  let startY = 0, pulling = false, scrollEl = null, indicator = null;

  function findScrollEl(target) {
    let el = target;
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains("content")) return el;
      el = el.parentElement;
    }
    return null;
  }
  function ensureIndicator() {
    if (indicator) return indicator;
    indicator = document.createElement("div");
    indicator.className = "pull-indicator";
    indicator.innerHTML = `<div class="spinner"></div>`;
    document.body.appendChild(indicator);
    return indicator;
  }

  document.addEventListener("touchstart", (e) => {
    scrollEl = findScrollEl(e.target);
    if (!scrollEl || scrollEl.scrollTop > 0) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!pulling || !scrollEl || scrollEl.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    const dist = Math.min(dy, 110);
    const ind = ensureIndicator();
    ind.style.transform = `translateX(-50%) translateY(${dist - 60}px)`;
    ind.querySelector(".spinner").classList.toggle("spin", dist > THRESHOLD);
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!pulling) return;
    pulling = false;
    if (!indicator) return;
    const style = indicator.style.transform;
    const match = style.match(/translateY\(([-\d.]+)px\)/);
    const dist = match ? parseFloat(match[1]) + 60 : 0;
    if (dist > THRESHOLD) {
      indicator.querySelector(".spinner").classList.add("spin");
      indicator.style.transform = `translateX(-50%) translateY(20px)`;
      setTimeout(() => location.reload(), 250);
    } else {
      indicator.style.transform = `translateX(-50%) translateY(-100%)`;
    }
  });
})();

// ==============================================================
// 水滴漣漪點擊效果（按鈕／卡片共用，純視覺，不影響原本的 onclick 邏輯）
// ==============================================================
(function initRippleEffect() {
  const SELECTOR = ".btn, .icon-btn, .fab, .card, .more-card, .status-card, .viewmode-card";
  document.addEventListener("pointerdown", (e) => {
    const target = e.target.closest(SELECTOR);
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
    target.appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
  }, { passive: true });
})();

// ==============================================================
// 底部導覽列的水滴狀分頁指示器：用 MutationObserver 盯著 .item 的
// class 變化（既有的分頁切換邏輯本來就是靠 classList.toggle("active",...)
// 切換），不用去改三個角色（承辦人／申請單位／營部連隊）各自的分頁切換
// 程式碼，指示器自己跟著切換到對的位置。
// ==============================================================
(function initTabIndicator() {
  function ensureIndicator(tabbar) {
    let ind = tabbar.querySelector(".tab-indicator");
    if (!ind) {
      ind = document.createElement("div");
      ind.className = "tab-indicator";
      tabbar.insertBefore(ind, tabbar.firstChild);
    }
    return ind;
  }
  function positionIndicator(tabbar) {
    const items = tabbar.querySelectorAll(".item");
    const activeIdx = Array.from(items).findIndex(el => el.classList.contains("active"));
    const ind = ensureIndicator(tabbar);
    if (activeIdx === -1 || items.length === 0) { ind.style.opacity = "0"; return; }
    // 高度／垂直位置直接量測分頁按鈕本人的實際大小，不要用寫死的 px 值猜——
    // 圖示大小、字級以後再調整時，指示器都會自動跟著對齊，不會發生圖示/文字
    // 被指示器蓋不到、露出格子外面的情況。
    const tabbarRect = tabbar.getBoundingClientRect();
    const itemRect = items[activeIdx].getBoundingClientRect();
    const inset = 4;
    ind.style.width = (100 / items.length) + "%";
    ind.style.top = (itemRect.top - tabbarRect.top + inset) + "px";
    ind.style.height = Math.max(itemRect.height - inset * 2, 20) + "px";
    ind.style.transform = `translateX(${activeIdx * 100}%)`;
    ind.style.opacity = "1";
  }
  function scan() {
    document.querySelectorAll(".tabbar").forEach(positionIndicator);
  }
  new MutationObserver(scan).observe(document.body, { attributes: true, attributeFilter: ["class"], subtree: true });
  scan();
})();
</script>
